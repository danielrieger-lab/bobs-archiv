name: Sync Dreimetadaten

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dreimetadaten
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh episode catalog
        run: npm run sync:dreimetadaten

      - name: Commit changes
        run: |
          if git diff --quiet -- src/dreimetadaten-series.json public/covers; then
            echo "No catalog updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dreimetadaten-series.json public/covers
          git commit -m "chore: refresh episode catalog"
          git push